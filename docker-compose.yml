services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: suppliers
      POSTGRES_USER: suppliers
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local-demo-only}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U suppliers -d suppliers"]
      interval: 5s
      timeout: 3s
      retries: 15
    restart: unless-stopped
  app:
    build: .
    environment:
      DATABASE_URL: postgresql+psycopg://suppliers:${POSTGRES_PASSWORD:-local-demo-only}@db:5432/suppliers
      SEED_DEMO: ${SEED_DEMO:-true}
      STALE_DAYS: ${STALE_DAYS:-90}
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "127.0.0.1:8000:8000"
    restart: unless-stopped
volumes:
  postgres_data:
