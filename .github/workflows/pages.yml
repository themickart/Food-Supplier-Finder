name: Check Pages build

# Pages serves the compiled gh-pages branch. This workflow checks main and
# retains the static build as an artifact; it does not change deployment branches.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm run check:publication
      - run: npm ci
      - run: npm test
      - run: npm run build:pages
      - run: npm run check:publication -- --pages-dir frontend/dist-pages
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e -- --output test-results-pages
        env:
          PLAYWRIGHT_STANDALONE: '1'
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: frontend/dist-pages
